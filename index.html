<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .form-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
      text-align: center;
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #666;
      font-size: 14px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      border-color: #007bff;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      border: none;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #0056b3;
    }

    .status-msg {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      display: none;
    }

    .status-msg.success {
      color: #28a745;
    }

    .status-msg.error {
      color: #dc3545;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Send a Message</h2>
    <form id="contactForm">
      <div class="input-group">
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="Your Name">
      </div>

      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="Your Email">
      </div>

      <div class="input-group">
        <label for="message">Message</label>
        <textarea id="message" rows="4" required placeholder="Write your message here..."></textarea>
      </div>

      <button type="submit" id="submitBtn">Send</button>
    </form>

    <div id="statusMessage" class="status-msg"></div>
  </div>

  <script>
    // REPLACE THIS WITH YOUR EMAIL ADDRESS
    const RECIPIENT_EMAIL = "your-email@example.com";

    const form = document.getElementById("contactForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMessage");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      // Collect field values
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const message = document.getElementById("message").value;

      submitBtn.innerText = "Sending...";
      submitBtn.disabled = true;

      try {
        const response = await fetch(`https://formsubmit.co/ajax/${RECIPIENT_EMAIL}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            _subject: `New Message from ${name}`,
            _template: "table",
            Name: name,
            Email: email,
            Message: message
          })
        });

        const data = await response.json();

        if (response.ok && data.success === "true") {
          statusMsg.innerText = "Message sent successfully!";
          statusMsg.className = "status-msg success";
          statusMsg.style.display = "block";
          form.reset();
        } else {
          throw new Error("Failed to send message.");
        }
      } catch (error) {
        statusMsg.innerText = "Error sending message. Please try again.";
        statusMsg.className = "status-msg error";
        statusMsg.style.display = "block";
      } finally {
        submitBtn.innerText = "Send";
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
